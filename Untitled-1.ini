<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пингвины из Мадагаскара — Спецдосье</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #102a43, #1982c4);
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .profile-container {
            max-width: 750px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            letter-spacing: 1px;
        }
        .main-photo {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }
        .main-photo:hover {
            transform: scale(1.02);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: #ffffff;
            color: #222222;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background-color: #000000;
            color: #ffffff;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .name-tag {
            font-weight: bold;
            color: #1982c4;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <h1>СЕКРЕТНОЕ ДОСЬЕ: ПИНГВИНЫ</h1>
        
        <!-- Фотография из вашего запроса -->
        <img class="main-photo" src="https://avatarko.ru/img/kartinka/1/multfilm_pingviny.jpg" alt="Команда пингвинов">

        <!-- Тематическая таблица -->
        <table>
            <thead>
                <tr>
                    <th>Оперативник</th>
                    <th>Звание / Роль</th>
                    <th>Ключевой навык</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="name-tag">Шкипер</td>
                    <td>Командир отряда</td>
                    <td>Стратегическое планирование и рукопашный бой</td>
                </tr>
                <tr>
                    <td class="name-tag">Ковальски</td>
                    <td>Технический аналитик</td>
                    <td>Научные изобретения и мгновенные расчеты</td>
                </tr>
                <tr>
                    <td class="name-tag">Рико</td>
                    <td>Специалист по арсеналу</td>
                    <td>Хранение любых предметов в желудке и взрывотехника</td>
                </tr>
                <tr>
                    <td class="name-tag">Рядовой</td>
                    <td>Секретное оружие (Милашка)</td>
                    <td>Маскировка, дипломатия и обнаружение ловушек</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
